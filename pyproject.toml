[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagentos-starter"
version = "0.1.0"
description = "OmniAgentOS Starter — hand it a goal; a team of agents plans, executes, critiques, verifies and loops until done."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OmniRogue" }]
keywords = ["agents", "orchestration", "llm", "fastapi", "sse"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "playwright>=1.44",
]

[project.scripts]
omniagentos = "omniagentos_starter.cli:main"
omniagentos-lite = "omniagentos_starter.cli:main"

[project.urls]
Homepage = "https://github.com/omnirogue/OmniAgentOS-Starter"

[tool.setuptools.packages.find]
include = ["omniagentos_starter*"]

# What ships inside the package: the dashboard, the recorded demo run, the
# built-in fallback pack — and, snapshotted at build time by setup.py, the skill
# library and the brand assets.
#
# `skills/` and `assets/` live at the repo ROOT in git, because that is where a
# user edits them and one copy is the only way to avoid drift. package-data can
# only reach inside the package tree, so setup.py's build_py hook copies them in
# when a wheel is built. An editable install skips the copy and reads the
# checkout directly — skills_dir()/assets_dir() prefer the repo-root copy and
# fall back to the packaged snapshot, so both installs find the same ten packs
# and the same logo. Before this, `pip install` from a wheel gave you zero
# skills and a 404 where the header logo should be.
[tool.setuptools.package-data]
omniagentos_starter = [
  "static/*",
  "data/*.json",
  "builtin_skills/*.md",
  "builtin_agents/*.md",
  "skills/*.md",
  "skills/*/*.md",
  "agents/*.md",
  "assets/*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
